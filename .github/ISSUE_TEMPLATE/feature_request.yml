name: Feature request
description: Suggest an improvement to OctoPrint-Slack.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search existing issues and
        explain the problem before describing a preferred implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need or limitation would this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, or links that clarify the request.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
